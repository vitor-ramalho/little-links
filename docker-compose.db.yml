version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: little-links-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: little_link
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    command: >
      postgres 
      -c shared_buffers=1GB 
      -c effective_cache_size=3GB 
      -c work_mem=64MB 
      -c maintenance_work_mem=512MB
      -c max_connections=200
      -c log_statement=all
      -c log_min_duration_statement=1000
    networks:
      - little-links-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d little_link"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  little-links-network:
    driver: bridge
    name: little-links-network
